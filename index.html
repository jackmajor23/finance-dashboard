<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Wealth Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ... your existing CSS stays here ... */
:root { --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0eff9; --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14); --text: #1a1a24; --muted: #888799; --muted2: #5a5970; --green: #0e9e6a; --green-dim: rgba(14,158,106,0.1); --red: #d94040; --red-dim: rgba(217,64,64,0.09); --accent: #5b4ef5; --accent-dim: rgba(91,78,245,0.1); --amber: #c47f0a; --amber-dim: rgba(196,127,10,0.1); --blue: #2378d5; --blue-dim: rgba(35,120,213,0.1); --teal: #0e8f85; --teal-dim: rgba(14,143,133,0.1); --pink: #c2407a; --pink-dim: rgba(194,64,122,0.1); --sidebar-w: 230px; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif;}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{padding:28px 32px;overflow-y:auto;max-width:1200px;}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.logo-name{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
.nav-section{padding:0 12px;margin-bottom:4px;}
.nav-label{font-size:10px;letter-spacing:.1em;color:var(--muted);padding:0 8px;margin-bottom:4px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted2);transition:all .15s;font-size:12px;border:none;background:none;width:100%;text-align:left;font-family:'DM Mono',monospace;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:500;}
.page{display:none;}
.page.active{display:block;}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;}
.stat-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;}
.pos{color:var(--green);} .neg{color:var(--red);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
/* [HIDDEN FOR BREVITY - CSS CONTINUES...] */
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-name">My Wealth</div>
      <div class="logo-sub">personal finance dashboard</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Overview</div>
      <button class="nav-item active" onclick="nav('overview',this)">▣ &nbsp;Overview</button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Assets</div>
      <button class="nav-item" onclick="nav('holdings',this)">◫ &nbsp;Holdings</button>
      <button class="nav-item" onclick="nav('accounts',this)">◳ &nbsp;Accounts & ISAs</button>
    </div>
    </nav>

  <main class="main">
    <div class="page active" id="page-overview">
      <div class="page-header">
        <h2 id="overview-greeting">Overview</h2>
        <p id="overview-date"></p>
      </div>
      <div class="summary-grid" id="summary-cards"></div>
      </div>
    
    <div class="page" id="page-holdings">
       <div class="page-header"><h2>Holdings</h2></div>
       <p>Section logic coming soon...</p>
    </div>
    </main>
</div>

<script>
// 1. STATE MANAGEMENT
const SK = 'wealth_v3';
let S = {
  settings: { name: '', title: 'My Wealth', currency: '£' },
  holdings: [],
  accounts: [],
  debts: [],
  lastUpdated: null
};

// 2. NAVIGATION (Fixed "nav is not defined")
function nav(pageId, element) {
  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  // Deactivate all nav buttons
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  // Show selected page
  const target = document.getElementById('page-' + pageId);
  if (target) {
    target.classList.add('active');
  }
  
  // Highlight clicked button
  if (element) {
    element.classList.add('active');
  }

  // Run the specific render function for this page
  if (pageId === 'overview') renderOverview();
  // Add other page renderers here as you build them
}

// 3. OVERVIEW RENDERER
function renderOverview() {
  const hr = new Date().getHours();
  // FIXED: Removed quotes around hr<17 logic
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  
  const greetingEl = document.getElementById('overview-greeting');
  if (greetingEl) greetingEl.textContent = greet;

  const dateEl = document.getElementById('overview-date');
  if (dateEl) dateEl.textContent = new Date().toLocaleDateString('en-GB', { dateStyle: 'full' });

  updateSummaryCards();
}

function updateSummaryCards() {
  const el = document.getElementById('summary-cards');
  if (!el) return;

  // Example placeholder calculation
  const totalValue = S.holdings.reduce((sum, h) => sum + (h.current || 0), 0);
  
  el.innerHTML = `
    <div class="stat-card accent">
      <div class="stat-label">Net Worth</div>
      <div class="stat-val">£${totalValue.toLocaleString()}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Investments</div>
      <div class="stat-val">£0</div>
    </div>
  `;
}

// 4. INITIALIZE
window.onload = () => {
  // Load data from LocalStorage if it exists
  const saved = localStorage.getItem(SK);
  if (saved) S = JSON.parse(saved);
  
  // Start on overview
  nav('overview', document.querySelector('.nav-item.active'));
};
</script>
</body>
</html>
